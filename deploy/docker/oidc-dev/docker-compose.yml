# Local OIDC test provider (Dex) for trying out babytracker's OIDC login.
#
# Start:   docker compose -f deploy/docker/oidc-dev/docker-compose.yml up -d
# Stop:    docker compose -f deploy/docker/oidc-dev/docker-compose.yml down
#
# Test user: alice@example.com / password  (dev only, do not reuse)
#
# Point babytracker at this provider (backend running on the host):
#   OIDC_ISSUER=http://localhost:5556/dex
#   OIDC_CLIENT_ID=babytracker
#   OIDC_CLIENT_SECRET=babytracker-dev-secret
#   OIDC_REDIRECT_URL=http://localhost:8080/api/auth/oidc/callback
#   OIDC_PROVIDER_NAME=Dex (dev)
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped
